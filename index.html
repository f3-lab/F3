<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Меню</title>

<style>

body{
font-family: Arial;
background:#f5f5f5;
margin:0;
padding:20px;
}

.menu-card{
background:white;
border-radius:12px;
padding:15px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
display:flex;
gap:15px;
align-items:flex-start;
}

.menu-card img{
width:90px;
height:90px;
object-fit:cover;
border-radius:10px;
}

.menu-info{
flex:1;
}

.title{
font-weight:700;
font-size:16px;
margin-bottom:6px;
}

.description{
font-size:13px;
color:#666;
margin-bottom:10px;
}

.weight-buttons{
display:flex;
gap:6px;
margin-bottom:10px;
}

.weight-buttons button{
border:1px solid #ddd;
background:white;
padding:5px 10px;
border-radius:6px;
cursor:pointer;
font-size:13px;
}

.weight-buttons button.active{
background:black;
color:white;
border-color:black;
}

.bottom-row{
display:flex;
justify-content:space-between;
align-items:center;
}

.price{
font-weight:700;
font-size:16px;
}

.add-btn{
background:black;
color:white;
border:none;
padding:6px 14px;
border-radius:6px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="menu-card">

<img src="https://github.com/f3-lab/F3/blob/main/4B546A5A-6CF8-4677-9CAA-A63CDDDCF026.jpeg?raw=true">

<div class="menu-info">

<div class="title">Лосось слабосоленый</div>

<div class="description">
Свежий лосось шеф-посола
</div>

<div class="weight-buttons">
<button class="weight active" data-price="12">100 г</button>
<button class="weight" data-price="22">200 г</button>
<button class="weight" data-price="40">400 г</button>
</div>

<div class="bottom-row">

<div class="price">12 €</div>

<button class="add-btn">Добавить</button>

</div>

</div>
</div>


<script>

document.querySelectorAll(".menu-card").forEach(card=>{

const buttons=card.querySelectorAll(".weight")
const price=card.querySelector(".price")

buttons.forEach(btn=>{

btn.addEventListener("click",()=>{

buttons.forEach(b=>b.classList.remove("active"))

btn.classList.add("active")

price.textContent=btn.dataset.price+" €"

})

})

})

</script>

</body>
</html>
